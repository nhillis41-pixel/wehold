name: Update votes and publish site

on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 6–7 AM Central
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wehold-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Put uploaded files in their folders (only needed once)
        run: |
          set -e
          mv_if() { if [ -f "$1" ]; then mkdir -p "$(dirname "$2")"; git mv -f "$1" "$2"; fi; }
          for f in common.py members.py votes.py attendance.py zips.py validate.py build.py botauth.py requirements.txt; do mv_if "$f" "pipeline/$f"; done
          mv_if test_pipeline.py pipeline/tests/test_pipeline.py
          mv_if house_roll.xml pipeline/tests/fixtures/house_roll.xml
          mv_if senate_roll.xml pipeline/tests/fixtures/senate_roll.xml
          for f in app.js styles.css index.html icon.svg manifest.webmanifest; do mv_if "$f" "site/$f"; done
          mv_if votes.json curated/votes.json
          mv_if download .gitignore
          mv_if http-message-signatures-directory site/.well-known/http-message-signatures-directory
          git rm -q --ignore-unmatch update-and-deploy.yml
          if ! git diff --cached --quiet; then
            git config user.name "wehold-bot"
            git config user.email "wehold-bot@users.noreply.github.com"
            git commit -m "Organize uploaded files into folders"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run tests
        run: python pipeline/tests/test_pipeline.py

      - name: Fetch official votes, check them, build site data
        env:
          WEHOLD_BOT_KEY: ${{ secrets.WEHOLD_BOT_KEY }}
        run: python pipeline/build.py

      - name: Save updated data
        if: always()
        run: |
          git config user.name "wehold-bot"
          git config user.email "wehold-bot@users.noreply.github.com"
          for p in data site/data; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update vote data $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
