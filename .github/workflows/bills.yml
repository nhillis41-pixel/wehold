name: Bill breakdowns (Congress.gov)

# Collects official facts for every bill WeHold highlights: sponsor, status, CRS summary, CBO cost estimates,
# text versions, amendments and the bill's path. Uses the api.data.gov key saved as FEC_API_KEY (or CONGRESS_API_KEY).
# The hourly site update refreshes each bill's roll calls and publishes.

on:
  schedule:
    - cron: "17 10 * * *"   # 4:17am Central
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wehold-bills
  cancel-in-progress: false

jobs:
  bills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Test
        run: python pipeline/tests/test_bills.py
      - name: Collect from Congress.gov
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python pipeline/bills.py
      - name: Save
        run: |
          git config user.name "wehold-bot"
          git config user.email "wehold-bot@users.noreply.github.com"
          git add site/data/bills
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Update bill breakdown data $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
