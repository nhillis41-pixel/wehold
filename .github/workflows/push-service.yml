name: Alert service

# Tests the WeHold alert service (worker/) on every change, and deploys it to Cloudflare once the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are saved. Apple/Google push keys are copied from
# GitHub secrets into Cloudflare secrets when present. See mobile/README.md.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/push-service.yml"]
  workflow_dispatch: {}

concurrency:
  group: push-service
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "No Cloudflare key saved yet; skipping deploy."; exit 0; fi
          W="npx --yes wrangler@4"
          ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="wehold-push");console.log(d?d.uuid:"")})')
          if [ -z "$ID" ]; then
            $W d1 create wehold-push
            ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).find(x=>x.name==="wehold-push").uuid)})')
          fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          $W d1 execute wehold-push --remote --file schema.sql
          $W deploy
          for name in APNS_KEY APNS_KEY_ID APNS_TEAM_ID FCM_SERVICE_ACCOUNT; do
            val="${!name}"
            if [ -n "$val" ]; then printf '%s' "$val" | $W secret put "$name"; else echo "$name not saved yet."; fi
          done
