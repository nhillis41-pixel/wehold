name: Update votes and publish site

on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 6–7 AM Central
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wehold-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run tests
        run: python pipeline/tests/test_pipeline.py

      - name: Fetch official votes, check them, build site data
        run: python pipeline/build.py

      - name: Save updated data
        run: |
          git config user.name "wehold-bot"
          git config user.email "wehold-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Update vote data $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
